<div class="cap"><span class="dotc"></span>ACEE348 Ch.2 · <b>Disturbing (inertia) vs restoring (gravity)</b></div>
<div class="area"><div class="stage"><button class="playbtn" id="play">⏸</button><canvas id="c"></canvas></div>
<p class="note">The mass overshoots equilibrium because of inertia (the disturbing force); the spring — like gravity on a water surface — always pulls it back (the restoring force). The endless trade produces oscillation, and thus a wave.</p></div></div>
<script>
const g=9.81,rho=1025;
function solveK(sig,d){let k=sig*sig/g;for(let i=0;i<200;i++){const tk=Math.tanh(k*d);const f=g*k*tk-sig*sig;const df=g*tk+g*k*d*(1-tk*tk);let kn=k-f/df;if(!isFinite(kn)||kn<=0)kn=sig*sig/(g*Math.max(tk,1e-9));if(Math.abs(kn-k)<1e-12){k=kn;break;}k=kn;}return k;}
function waveProps(T,d){const sig=2*Math.PI/T,k=solveK(sig,d),L=2*Math.PI/k,C=sig/k,kd=k*d;let n;if(2*kd>700)n=0.5;else n=0.5*(1+2*kd/Math.sinh(2*kd));const Cg=n*C,dL=d/L;let reg='Intermediate water';if(dL>=0.5)reg='Deep water';else if(dL<=0.05)reg='Shallow water';return{sig,k,L,C,Cg,n,kd,dL,reg};}
const fx=(x,d)=>x.toFixed(d);
function setFill(el){if(!el)return;const mn=+el.min,mx=+el.max,v=+el.value;el.style.setProperty('--fill',((v-mn)/(mx-mn)*100)+'%');}
function fitCanvas(cv){const dpr=Math.min(window.devicePixelRatio||1,2);const w=cv.clientWidth,h=cv.clientHeight;cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);const c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);return[c,w,h];}
const REDUCE=window.matchMedia('(prefers-reduced-motion:reduce)').matches;

const cv=document.getElementById('c');let ctx,cw,ch;
function sz(){[ctx,cw,ch]=fitCanvas(cv);}
function arrow(x1,y1,x2,y2){ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();const a=Math.atan2(y2-y1,x2-x1);ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-9*Math.cos(a-0.4),y2-9*Math.sin(a-0.4));ctx.lineTo(x2-9*Math.cos(a+0.4),y2-9*Math.sin(a+0.4));ctx.closePath();ctx.fill();}
function draw(time){const t=time/1000;ctx.clearRect(0,0,cw,ch);ctx.fillStyle='#0A2A3A';ctx.fillRect(0,0,cw,ch);
 const midY=ch*0.5,x0=cw*0.06,eqX=cw*0.58,A=cw*0.16,mx=eqX+A*Math.cos(1.6*t),v=-A*1.6*Math.sin(1.6*t);
 ctx.strokeStyle='rgba(234,240,241,0.5)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x0,midY-34);ctx.lineTo(x0,midY+34);ctx.stroke();
 ctx.setLineDash([3,5]);ctx.strokeStyle='rgba(95,230,220,0.5)';ctx.beginPath();ctx.moveTo(eqX,midY-40);ctx.lineTo(eqX,midY+40);ctx.stroke();ctx.setLineDash([]);
 ctx.fillStyle='rgba(234,240,241,0.55)';ctx.font='12px "IBM Plex Mono",monospace';ctx.fillText('equilibrium',eqX-32,midY+58);
 const coils=14,seg=(mx-18-x0)/coils;ctx.strokeStyle='#43D0C7';ctx.lineWidth=2.2;ctx.beginPath();ctx.moveTo(x0,midY);for(let i=0;i<coils;i++){ctx.lineTo(x0+seg*(i+0.5),midY+(i%2?14:-14));}ctx.lineTo(mx-18,midY);ctx.stroke();
 ctx.fillStyle='#F2A93B';ctx.strokeStyle='#FBD08A';ctx.lineWidth=2;ctx.beginPath();ctx.rect(mx-18,midY-18,36,36);ctx.fill();ctx.stroke();
 const rd=(mx>eqX)?-1:1;ctx.fillStyle='#5FE6DC';ctx.strokeStyle='#5FE6DC';arrow(mx,midY-30,mx+rd*34,midY-30);ctx.fillText('restoring',mx+rd*34-(rd<0?64:0),midY-38);
 const vd=(v>=0)?1:-1;ctx.fillStyle='#F2A93B';ctx.strokeStyle='#F2A93B';arrow(mx,midY+32,mx+vd*30,midY+32);ctx.fillText('inertia',mx+vd*30-(vd<0?48:0),midY+50);}
let start=performance.now(),frozen=0,playing=true;function loop(now){if(playing)draw(now-start+frozen);requestAnimationFrame(loop);}
window.addEventListener('resize',sz);
window.addEventListener('load',()=>{sz();document.getElementById('play').addEventListener('click',()=>{playing=!playing;const b=document.getElementById('play');if(playing){start=performance.now();b.textContent='⏸';}else{frozen+=performance.now()-start;b.textContent='▶';}});
 if(REDUCE){playing=false;document.getElementById('play').textContent='▶';draw(0);}requestAnimationFrame(loop);});
</script></body></html>
