<style>

</style></head><body><div class="page">
<div class="cap"><span class="dotc"></span>ACEE348 Ch.2 · <b>Vertical structure |u|, |w|, K_p</b> — set T, d</div>
<div class="area">
 <div class="stage" style="background:var(--card)"><canvas id="c"></canvas></div>
 <div class="legend" style="flex:0 0 auto"><span><span class="sw" style="background:#E8663C"></span> |u|</span><span><span class="sw" style="background:#3E9BB0"></span> |w|</span><span><span class="sw" style="background:#F2A93B"></span> K_p (dyn. pressure)</span></div>
 <div class="card controls" style="flex:0 0 auto"><div class="ctrls3">
  <div class="ctrl"><div class="ctrl-top"><label>T</label><span class="val"><span id="Tv">8.0</span> s</span></div><input type="range" id="T" min="3" max="16" step="0.1" value="8"></div>
  <div class="ctrl"><div class="ctrl-top"><label>d</label><span class="val"><span id="dv">10</span> m</span></div><input type="range" id="d" min="1" max="120" step="0.5" value="10"></div>
 </div><p class="note">|u|,|w| share one scale (÷ surface |u|). Deep: all collapse toward the bed. Shallow: |u|,K_p nearly uniform while |w|→0 at bed.</p></div>
</div></div>
<script>
const g=9.81,rho=1025;
function solveK(sig,d){let k=sig*sig/g;for(let i=0;i<200;i++){const tk=Math.tanh(k*d);const f=g*k*tk-sig*sig;const df=g*tk+g*k*d*(1-tk*tk);let kn=k-f/df;if(!isFinite(kn)||kn<=0)kn=sig*sig/(g*Math.max(tk,1e-9));if(Math.abs(kn-k)<1e-12){k=kn;break;}k=kn;}return k;}
function waveProps(T,d){const sig=2*Math.PI/T,k=solveK(sig,d),L=2*Math.PI/k,C=sig/k,kd=k*d;let n;if(2*kd>700)n=0.5;else n=0.5*(1+2*kd/Math.sinh(2*kd));const Cg=n*C,dL=d/L;let reg='Intermediate water';if(dL>=0.5)reg='Deep water';else if(dL<=0.05)reg='Shallow water';return{sig,k,L,C,Cg,n,kd,dL,reg};}
const fx=(x,d)=>x.toFixed(d);
function setFill(el){if(!el)return;const mn=+el.min,mx=+el.max,v=+el.value;el.style.setProperty('--fill',((v-mn)/(mx-mn)*100)+'%');}
function fitCanvas(cv){const dpr=Math.min(window.devicePixelRatio||1,2);const w=cv.clientWidth,h=cv.clientHeight;cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);const c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);return[c,w,h];}
const REDUCE=window.matchMedia('(prefers-reduced-motion:reduce)').matches;

const state={T:8,d:10};const cv=document.getElementById('c');let ctx,cw,ch;
function sz(){[ctx,cw,ch]=fitCanvas(cv);draw();}
function draw(){const {T,d}=state,p=waveProps(T,d),k=p.k,kd=k*d;
 const padL=52,padR=16,padT=16,padB=30,x0=padL,x1=cw-padR,yt=padT,yb=ch-padB;
 ctx.clearRect(0,0,cw,ch);ctx.strokeStyle='#D3DEDF';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x0,yt);ctx.lineTo(x0,yb);ctx.lineTo(x1,yb);ctx.stroke();
 ctx.fillStyle='#5A6B72';ctx.font='11px "IBM Plex Mono",monospace';ctx.fillText('magnitude (normalised)',(x0+x1)/2-58,ch-8);
 ctx.save();ctx.translate(13,(yt+yb)/2);ctx.rotate(-Math.PI/2);ctx.fillText('z  (SWL → bed)',-34,0);ctx.restore();
 ctx.fillText('SWL',x0-30,yt+4);ctx.fillText('bed',x0-28,yb);
 [0,0.5,1].forEach(v=>{const xx=x0+(x1-x0)*v;ctx.strokeStyle='#EEF3F3';ctx.beginPath();ctx.moveTo(xx,yt);ctx.lineTo(xx,yb);ctx.stroke();ctx.fillStyle='#8A979C';ctx.fillText(v.toFixed(1),xx-6,yb+15);});
 const uS=(kd>20)?1:(Math.cosh(kd)/Math.sinh(kd));
 const cs=[{c:'#E8663C',fn:z=>(kd>20?Math.exp(k*z):Math.cosh(k*(d+z))/Math.sinh(kd))/uS},{c:'#3E9BB0',fn:z=>(kd>20?Math.exp(k*z):Math.sinh(k*(d+z))/Math.sinh(kd))/uS},{c:'#F2A93B',fn:z=>(kd>20?Math.exp(k*z):Math.cosh(k*(d+z))/Math.cosh(kd))}];
 const zY=z=>yb+(z/d)*(yb-yt),vX=v=>x0+Math.max(0,Math.min(1.05,v))/1.05*(x1-x0);
 cs.forEach(cv2=>{ctx.beginPath();for(let i=0;i<=60;i++){const z=-d*(i/60),X=vX(cv2.fn(z)),Y=zY(z);if(i===0)ctx.moveTo(X,Y);else ctx.lineTo(X,Y);}ctx.strokeStyle=cv2.c;ctx.lineWidth=2.4;ctx.stroke();});}
function bind(id,key,disp,dec){const el=document.getElementById(id);setFill(el);el.addEventListener('input',()=>{state[key]=+el.value;document.getElementById(disp).textContent=(+el.value).toFixed(dec);setFill(el);draw();});}
window.addEventListener('resize',sz);
window.addEventListener('load',()=>{sz();bind('T','T','Tv',1);bind('d','d','dv',0);draw();});
</script></body></html>
